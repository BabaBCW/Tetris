version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    privileged: true                      # needed for Docker-in-Docker
    user: root
    ports:
      - "8081:8080"                       # Jenkins UI  → http://localhost:8081
      - "50000:50000"                     # Jenkins agent port
    volumes:
      - jenkins_home:/var/jenkins_home    # persist Jenkins data
      - /var/run/docker.sock:/var/run/docker.sock   # share host Docker daemon
      - /usr/bin/docker:/usr/bin/docker   # share docker CLI binary
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false   # skip setup wizard (optional)
    networks:
      - jenkins_net

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins_net:
    driver: bridge
